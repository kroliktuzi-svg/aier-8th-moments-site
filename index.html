<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd429" />
    <meta name="description" content="瑷尔博士8周年朋友圈素材随机生成页" />
    <meta name="format-detection" content="telephone=no" />
    <title>瑷尔博士8周年朋友圈素材</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffd429'/%3E%3Cpath d='M18 18h28v28H18z' fill='%230064c8'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='Arial' font-size='28' font-weight='700' fill='white'%3E8%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div class="hero__badge">HAPPY 8TH BIRTHDAY</div>
        <h1>你的8周年朋友圈<br />已生成</h1>
        <p>复制文案，再长按保存4张图片</p>
      </header>

      <section class="copy-card" aria-labelledby="copy-title">
        <div class="section-label" id="copy-title"><span>01</span> 朋友圈文案</div>
        <p class="copy-text" id="copyText" aria-live="polite"></p>
        <button class="button button--primary" id="copyButton" type="button">
          <span class="button__icon" aria-hidden="true">⧉</span>
          <span>复制文案</span>
        </button>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="gallery-heading">
          <div class="section-label" id="gallery-title"><span>02</span> 配图素材</div>
          <p>按顺序保存 · 长按图片即可</p>
        </div>
        <div class="gallery" id="gallery"></div>
      </section>

      <button class="button button--refresh" id="refreshButton" type="button">
        <span class="button__icon button__icon--refresh" aria-hidden="true">↻</span>
        <span>换一组</span>
      </button>
      <p class="footer-note">每次刷新页面，也会获得一组新的朋友圈素材</p>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite">复制成功</div>

    <script src="./data/copywriting.js"></script>
    <script src="./data/images.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
